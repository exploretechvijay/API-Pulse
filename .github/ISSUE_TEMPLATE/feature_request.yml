name: Feature request
description: Suggest an idea or improvement for API Pulse
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation and why the current behaviour is not enough. "As a … I want … so that …" works well.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like API Pulse to handle it?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Monitoring / dashboard
        - Alerts & channels
        - Latency test
        - Load / stress test
        - Network profiles
        - Reports & summaries
        - Configuration / API / CI
        - Installation / deployment
        - Other
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself
